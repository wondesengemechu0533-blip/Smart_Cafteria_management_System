<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="cashier_receipts">Receipts - Smart Cafeteria</title>

    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/admin.css">
    <link rel="stylesheet" href="/src/css/delivery.css">
    <link rel="stylesheet" href="../../css/themes/dark-theme.css">
    <script src="../../js/theme.js"></script>
</head>
<body class="admin-body">
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar cashier-sidebar" id="cashierSidebar"></aside>
        <main class="admin-main">
            <div class="delivery-header">
                <h1><i class="fa-solid fa-file-invoice"></i> <span data-i18n="cashier_receipts">Receipts</span></h1>
                <div class="page-actions">
                    <button type="button" class="btn btn-secondary" id="refreshReceiptsBtn"><i class="fa-solid fa-rotate"></i> Refresh</button>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;">
                        <div>
                            <label class="form-label" for="receiptSearchInput">Search</label>
                            <input type="text" id="receiptSearchInput" class="form-control" placeholder="Order #, customer..." style="min-width:220px;">
                        </div>
                        <div>
                            <label class="form-label" for="receiptDateFilter">Date</label>
                            <input type="date" id="receiptDateFilter" class="form-control">
                        </div>
                        <div>
                            <button type="button" class="btn btn-primary" id="applyReceiptFiltersBtn"><i class="fa-solid fa-filter"></i> Apply</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="errorBanner" class="error-banner" style="display:none;"></div>

            <div class="card">
                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Amount</th>
                                <th>Payment</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="receiptsTableBody">
                            <tr><td colspan="8" class="table-empty">Loading receipts...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <span class="pagination-info" id="receiptsPaginationInfo">Page 1</span>
                    <div class="pagination-actions">
                        <button class="btn btn-secondary" id="prevReceiptsPageBtn">Prev</button>
                        <button class="btn btn-secondary" id="nextReceiptsPageBtn">Next</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Receipt modal -->
    <div class="modal-overlay" id="receiptModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Receipt</h3>
                <button class="modal-close" data-close-modal="receiptModal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="receiptDetail" style="font-size:14px;line-height:1.6;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal="receiptModal">Close</button>
                <button type="button" class="btn btn-primary" id="printReceiptBtn"><i class="fa-solid fa-print"></i> Print</button>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/cashier-layout.js"></script>
    <script src="../../js/cashier-receipts.js"></script>
    <script>
        function initPageSpecific() {}
    </script>
</body>
</html>
