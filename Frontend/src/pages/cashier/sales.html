<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="cashier_sales">Sales - Smart Cafeteria</title>

    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/admin.css">
    <link rel="stylesheet" href="/src/css/delivery.css">
    <link rel="stylesheet" href="../../css/themes/dark-theme.css">
    <script src="../../js/theme.js"></script>
</head>
<body class="admin-body">
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar cashier-sidebar" id="cashierSidebar"></aside>
        <main class="admin-main">
            <div class="delivery-header">
                <h1><i class="fa-solid fa-chart-column"></i> <span data-i18n="cashier_sales">Sales</span></h1>
                <div class="page-actions">
                    <button type="button" class="btn btn-secondary" id="refreshSalesBtn"><i class="fa-solid fa-rotate"></i> Refresh</button>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;">
                        <div>
                            <label class="form-label" for="salesDate"><i class="fa-solid fa-calendar-days"></i> Date</label>
                            <input type="date" id="salesDate" class="form-control" style="min-width:200px;">
                        </div>
                        <div>
                            <button type="button" class="btn btn-primary" id="loadSalesBtn"><i class="fa-solid fa-magnifying-glass"></i> Load</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="errorBanner" class="error-banner" style="display:none;"></div>

            <div id="salesResults" style="display:none;">
                <div class="stats-row">
                    <div class="stat-card"><div class="num" id="salesStatTotal">0.00 ETB</div><div class="lbl">Total Collected</div></div>
                    <div class="stat-card"><div class="num" id="salesStatCash">0.00 ETB</div><div class="lbl">Cash</div></div>
                    <div class="stat-card"><div class="num" id="salesStatElectronic">0.00 ETB</div><div class="lbl">Electronic</div></div>
                    <div class="stat-card"><div class="num" id="salesStatNet">0.00 ETB</div><div class="lbl">Net Cash at Hand</div></div>
                    <div class="stat-card"><div class="num" id="salesStatVat">0.00 ETB</div><div class="lbl">VAT Collected</div></div>
                    <div class="stat-card"><div class="num" id="salesStatTxns">0</div><div class="lbl">Transactions</div></div>
                </div>

                <div class="section-title">
                    <h3><i class="fa-solid fa-list-check" style="color:#2563eb;"></i> Sales Breakdown</h3>
                </div>

                <div class="card">
                    <div class="table-wrapper">
                        <table class="admin-table">
                            <tbody id="salesTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/config.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/cashier-layout.js"></script>
    <script src="../../js/cashier-sales.js"></script>
    <script>
        function initPageSpecific() {}
    </script>
</body>
</html>
