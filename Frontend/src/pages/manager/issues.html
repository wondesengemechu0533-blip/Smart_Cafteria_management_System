<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="manager_issue_reports_title">Issue Reports - Smart Cafeteria</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">

    <!-- Admin CSS stylesheet -->
    <link rel="stylesheet" href="/src/css/admin.css">

    <!-- Shared Theme -->
    <link rel="stylesheet" href="../../css/themes/dark-theme.css">
    <script src="../../js/theme.js"></script>

    <style>
        .issue-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .issue-tab {
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            background: #fff;
            color: #6b7280;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .issue-tab.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .issue-tab:hover:not(.active) { background: #f3f4f6; }
        .issue-tab .tab-count {
            display: inline-block;
            min-width: 20px;
            padding: 1px 6px;
            margin-left: 6px;
            border-radius: 10px;
            background: rgba(0,0,0,0.08);
            font-size: 0.75rem;
        }
        .issue-tab.active .tab-count { background: rgba(255,255,255,0.25); }

        .issue-status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .issue-status-PENDING { background: #fff3cd; color: #856404; }
        .issue-status-ACCEPTED { background: #cfe2ff; color: #084298; }
        .issue-status-RESOLVED { background: #d1e7dd; color: #0f5132; }

        .issue-priority-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .issue-priority-low { background: #e0f2fe; color: #075985; }
        .issue-priority-medium { background: #fef3c7; color: #92400e; }
        .issue-priority-high { background: #ffedd5; color: #9a3412; }
        .issue-priority-critical { background: #fee2e2; color: #991b1b; }

        .issue-category-chip {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 4px;
            background: #f3f4f6;
            color: #4b5563;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .issue-empty {
            text-align: center;
            padding: 48px 16px;
            color: #6b7280;
        }
        .issue-empty i { font-size: 40px; margin-bottom: 12px; display: block; color: #9ca3af; }
        .issue-error { color: #b91c1c; }

        .issue-loading { text-align: center; padding: 40px; color: #6b7280; }

        /* Detail modal */
        .issue-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .issue-modal-backdrop.active { display: flex; }
        .issue-modal {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 620px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 26px;
        }
        .issue-modal h2 { margin: 0 0 4px; font-size: 1.25rem; color: #0f172a; }
        .issue-modal .modal-meta { margin-bottom: 16px; }
        .issue-modal .detail-block { margin-bottom: 16px; }
        .issue-modal .detail-block h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #9ca3af;
            margin: 0 0 6px;
        }
        .issue-modal .detail-block p {
            margin: 0;
            font-size: 0.95rem;
            color: #1f2937;
            white-space: pre-wrap;
        }
        .issue-modal textarea,
        .issue-modal select {
            width: 100%;
            min-height: 110px;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.92rem;
            resize: vertical;
        }
        .issue-modal .solution-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-left: 4px solid #22c55e;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.95rem;
            color: #166534;
            white-space: pre-wrap;
        }
        .issue-modal .solution-meta { font-size: 0.8rem; color: #6b7280; margin-top: 8px; }
        .issue-modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .issue-modal .form-error { color: #b91c1c; font-size: 0.85rem; margin-top: 6px; min-height: 1.1em; }

        .quality-hold-warning {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-left: 4px solid #dc2626;
            border-radius: 8px;
            padding: 10px 12px;
            color: #991b1b;
            font-size: 0.88rem;
        }

        [data-theme="dark"] .issue-tab { background: #1e293b; border-color: #334155; color: #94a3b8; }
        [data-theme="dark"] .issue-tab.active { background: #2563eb; border-color: #2563eb; color: #fff; }
        [data-theme="dark"] .issue-tab:hover:not(.active) { background: #0f172a; }
        [data-theme="dark"] .issue-modal { background: #1e293b; }
        [data-theme="dark"] .issue-modal h2 { color: #f8fafc; }
        [data-theme="dark"] .issue-modal .detail-block p { color: #e2e8f0; }
        [data-theme="dark"] .issue-modal textarea {
            background: #0f172a;
            border-color: #334155;
            color: #e2e8f0;
        }
        [data-theme="dark"] .issue-modal .solution-box {
            background: #052e1f;
            border-color: #065f46;
            color: #6ee7b7;
        }
        [data-theme="dark"] .quality-hold-warning { background: #3b0f0f; border-color: #7f1d1d; color: #fca5a5; }
        [data-theme="dark"] .issue-category-chip { background: #334155; color: #cbd5e1; }
        [data-theme="dark"] .issue-status-PENDING { background: #422006; color: #fcd34d; }
        [data-theme="dark"] .issue-status-ACCEPTED { background: #0c1e3f; color: #93c5fd; }
        [data-theme="dark"] .issue-status-RESOLVED { background: #052e1f; color: #6ee7b7; }
        [data-theme="dark"] .issue-priority-low { background: #0c1e3f; color: #93c5fd; }
        [data-theme="dark"] .issue-priority-medium { background: #422006; color: #fcd34d; }
        [data-theme="dark"] .issue-priority-high { background: #431407; color: #fdba74; }
        [data-theme="dark"] .issue-priority-critical { background: #3b0f0f; color: #fca5a5; }
        [data-theme="dark"] .issue-empty { color: #94a3b8; }
    </style>
</head>

<body class="admin-body">

    <!-- Layout will be injected by admin-layout.js -->
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <main class="admin-main">
            <div class="page-header">
                <div>
                    <h1 data-i18n="manager_issue_reports_title"><i class="fa-solid fa-flag"></i> Issue Reports</h1>
                    <p data-i18n="manager_issue_reports_subtitle" style="color:#6b7280;font-size:0.9rem;margin:4px 0 0;">
                        Kitchen staff issue reports for your cafeteria — review, investigate, and submit restock requests; the Cafeteria Admin records the resolution.
                    </p>
                </div>
                <div class="page-actions">
                    <button type="button" class="btn btn-secondary" id="refreshIssuesBtn">
                        <i class="fa-solid fa-rotate"></i> <span data-i18n="report_refresh">Refresh</span>
                    </button>
                </div>
            </div>

            <!-- STATUS TABS -->
            <div class="issue-tabs" id="issueTabs">
<button type="button" class="issue-tab active" data-status=""><span data-i18n="filter_all">All</span> <span class="tab-count" id="countAll">0</span></button>
<button type="button" class="issue-tab" data-status="OPEN"><span data-i18n="issue_status_open">Open</span> <span class="tab-count" id="countOpen">0</span></button>
<button type="button" class="issue-tab" data-status="UNDER_REVIEW"><span data-i18n="issue_status_under_review">Under Review</span> <span class="tab-count" id="countUnderReview">0</span></button>
<button type="button" class="issue-tab" data-status="REQUEST_SENT"><span data-i18n="issue_status_request_sent">Request Sent</span> <span class="tab-count" id="countRequestSent">0</span></button>
<button type="button" class="issue-tab" data-status="RESOLVED"><span data-i18n="issue_status_resolved">Resolved</span> <span class="tab-count" id="countResolved">0</span></button>
            </div>

            <!-- ISSUES TABLE -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fa-solid fa-list-check"></i> <span data-i18nssue_reports">Reports</span></h3>
                </div>
                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th data-i18n="issue_col_title">Issue</th>
                                <th data-i18n="issue_title_reported_by">Reported By</th>
                                <th data-i18n="issue_col_category">Category</th>
                                <th data-i18n="issue_col_priority">Priority</th>
                                <th data-i18n="issue_col_status">Status</th>
                                <th data-i18n="issue_col_reported_at">Reported At</th>
                                <th data-i18n="admin_col_actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="issuesTableBody">
                            <tr><td colspan="7" class="issue-loading" data-i18n="issue_loading">Loading issue reports…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- ISSUE DETAILS MODAL (Accept / Send Solution / Solution view) -->
    <div class="issue-modal-backdrop" id="issueModalBackdrop">
        <div class="issue-modal" id="issueModal" role="dialog" aria-modal="true">
            <div id="issueModalContent"></div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../../js/config.js"></script>
    <script src="../../js/admin-api.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/admin-layout.js"></script>
    <script src="../../js/utils/resolution-options.js?v=20261015"></script>
    <script src="../../js/manager-issues.js"></script>
</body>
</html>
