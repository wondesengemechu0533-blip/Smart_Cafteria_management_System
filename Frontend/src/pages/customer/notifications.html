<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Smart Cafeteria</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/menu.css">
<link rel="stylesheet" href="/src/css/themes/dark-theme.css">
    <script src="../../js/config.js"></script>
<script src="../../js/theme.js"></script>
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar-header">
        <div class="nav-container">
            <div class="nav-left-group">
                <a href="menu.html" class="btn-back-home">
                    
                    <i class="fa-solid fa-arrow-left"></i>
                    <span data-i18n="menu">Menu</span>
                </a>
                <a href="menu.html" class="brand-logo">
                    <i class="fa-solid fa-utensils"></i> Smart
                </a>
            </div>

            <div class="header-actions">
                <button type="button" class="theme-toggle-btn nav-link-item" data-theme-toggle aria-label="Toggle theme" data-i18n-title="title_toggle_theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <a href="order-history.html" class="nav-link-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span data-i18n="history">History</span>
                </a>
                <a href="cart.html" class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-badge-count">0</span>
                </a>
                
                <!-- User Profile Dropdown -->
                <div class="user-profile-menu">
                    <button class="user-profile-btn" id="user-menu-btn">
                        <img class="avatar-img" alt="User Profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
                        <span class="user-name">Abebe k.</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-menu" id="user-dropdown-menu">
                        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
                        <a href="order-history.html"><i class="fa-solid fa-receipt"></i> My Orders</a>
                        <a href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a>
                        <a href="feedback.html"><i class="fa-solid fa-comment-dots"></i> Feedback</a>
                    </div>
                </div>
                <!-- Logout (top-right) -->
                <a href="../common/login.html" class="nav-link-item nav-logout logout-link" data-i18n-title="nav_logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span data-i18n="logout">Logout</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container profile-layout">

        <!-- The unified customer dashboard rail (customer-sidebar.js) is the
             sidebar here; this page renders only the content column. -->

        <!-- Main Content Area -->
        <section class="profile-content">
            <div class="content-header-flex">
                <div>
                    <h2><i class="fa-solid fa-bell"></i> Notifications</h2>
                    <p data-i18n="notifications_subtitle">Stay updated on your food order status and special cafeteria promotions.</p>
                </div>
                <div class="notification-actions">
                    <button id="mark-all-read-btn" class="btn btn-sm btn-outline">
                        <i class="fa-solid fa-check-double"></i> Mark All as Read
                    </button>
                    <button id="clear-notifications-btn" class="btn btn-sm btn-outline-danger">
                        <i class="fa-solid fa-trash-can"></i> Clear All
                    </button>
                </div>
            </div>

            <!-- Notifications List Container -->
            <div id="notifications-container" class="notifications-list">
                <!-- Dynamically populated via notifications.js -->
            </div>
        </section>

    </main>

    <script src="/public/assets/vendor/js/socket.io-4.7.5.min.js"></script>
    <script src="../../js/config.js"></script>
<script src="/src/js/notification.js" defer></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/profile.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/components/customer-sidebar.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/customer-realtime.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/components/unified-header.js"></script>
</body>
</html>
