<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart - Smart Cafeteria</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="/src/css/style.css">

    <!-- Cart CSS -->
    <link rel="stylesheet" href="/src/css/cart.css">
<link rel="stylesheet" href="/src/css/themes/dark-theme.css">

    <!--
        Food images are intentionally hidden in the cart.
        Remove this block if you want images later.
    -->
    <style>
        .cart-container img,
        .cart-items-section img,
        .cart-item img,
        .cart-food-image,
        .food-image,
        .item-image {
            display: none !important;
        }
    </style>
    <script src="../../js/config.js"></script>
<script src="../../js/theme.js"></script>
</head>

<body>

    <!-- ==============================
         NAVIGATION
    =============================== -->
    <header class="navbar">

        <div class="container nav-container">

            <!-- Back to Menu -->
            <div class="nav-left-group">
                <a href="menu.html" class="btn-back">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Menu
                </a>
            </div>

            <!-- Page Title -->
            <h2>
                <i class="fa-solid fa-cart-shopping"></i>
                My Food Cart
            </h2>

            <!-- Navigation Links -->
            <div class="nav-links">

                <button type="button" class="theme-toggle-btn nav-link-track" data-theme-toggle aria-label="Toggle theme" data-i18n-title="title_toggle_theme">
                    <i class="fa-solid fa-moon"></i>
                </button>

                <a
                    href="order-tracking.html"
                    class="nav-link-track"
                >
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    Track Order
                </a>

                <a
                    href="cart.html"
                    class="nav-cart-btn"
                    aria-label="Shopping Cart"
                >
                    <i class="fa-solid fa-cart-shopping"></i>

                    <!-- UNIQUE ID -->
                    <span id="navbar-cart-count">0</span>
                </a>

                <a
                    href="../common/login.html"
                    class="nav-icon-link nav-logout"
                    data-i18n-title="nav_logout"
                    onclick="localStorage.clear()"
                >
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>

            </div>

        </div>

    </header>


    <!-- ==============================
         MAIN CART
    =============================== -->

    <main class="container cart-layout">

        <!-- ==============================
             LEFT: CART ITEMS
        =============================== -->

        <section class="cart-items-section">

            <div class="cart-header">

                <h3>
                    Order Items
                    (
                    <span id="items-cart-count">0</span>
                    )
                </h3>

                <button
                    id="clear-cart-btn"
                    class="btn btn-sm btn-outline-danger"
                    type="button"
                    style="display: none;"
                >
                    <i class="fa-solid fa-trash"></i>
                    Clear All
                </button>

            </div>


            <!--
                JavaScript will insert cart items here.
            -->
            <div
                id="cart-container"
                class="cart-container"
            >

                <!-- Empty state / cart items generated by cart.js -->

            </div>

        </section>


        <!-- ==============================
             RIGHT: ORDER SUMMARY
        =============================== -->

        <aside class="cart-summary-section">

            <div class="summary-card">

                <h3 data-i18n="order_summary">Order Summary</h3>

                <hr>


                <!-- SUBTOTAL -->

                <div class="summary-row">

                    <span data-i18n="subtotal">Subtotal</span>

                    <span>
                        <strong id="summary-subtotal">0</strong>
                        <small>ETB</small>
                    </span>

                </div>


                <!-- SERVICE FEE -->

                <div class="summary-row">

                    <span data-i18n="service_fee">Service Fee</span>

                    <span>
                        <strong id="summary-service-fee">0</strong>
                        <small>ETB</small>
                    </span>

                </div>


                <hr class="divider">


                <!-- TOTAL -->

                <div class="summary-row total-row">

                    <span data-i18n="total_amount">Total Amount</span>

                    <span>
                        <strong id="summary-total">0</strong>
                        <small>ETB</small>
                    </span>

                </div>


                <!-- ACTIONS -->

                <div class="summary-actions">

                    <button
                        id="checkout-btn"
                        class="btn btn-primary btn-block"
                        type="button"
                        disabled
                    >
                        Proceed to Checkout

                        <i class="fa-solid fa-credit-card"></i>
                    </button>


                    <a
                        href="menu.html"
                        class="btn btn-secondary btn-block"
                        data-i18n="add_more_food"
                    >
                        Add More Food
                    </a>

                </div>

            </div>

        </aside>

    </main>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <!-- Cart JavaScript -->
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/cart.js"></script>
    <script src="/public/assets/vendor/js/socket.io-4.7.5.min.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/customer-realtime.js"></script>

    <script src="../../js/config.js"></script>
<script type="module" src="../../js/components/unified-header.js"></script>
<script src="../../js/config.js"></script>
<script type="module" src="../../js/components/customer-sidebar.js"></script>
</body>

</html>
