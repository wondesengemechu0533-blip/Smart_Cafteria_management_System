<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - TasteEthio Cafeteria</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/menu.css">
<link rel="stylesheet" href="/src/css/themes/dark-theme.css">
<script src="../../js/config.js"></script>
<script src="../../js/theme.js"></script>

    <style>
        /* Password show/hide toggle icon */
        .input-wrapper { position: relative; }
        .input-wrapper .toggle-password-icon {
            position: absolute;
            right: 11px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            color: #64748b;
            transition: color 0.2s ease;
            z-index: 1;
        }
        .input-wrapper .toggle-password-icon:hover { color: var(--primary, #f97316); }
        .input-wrapper input { padding-right: 38px; }
        [data-theme="dark"] .input-wrapper .toggle-password-icon { color: #94a3b8; }
        [data-theme="dark"] .input-wrapper .toggle-password-icon:hover { color: #f97316; }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar-header">
        <div class="nav-container">
            <div class="nav-left-group">
                <a href="menu.html" class="btn-back-home">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span data-i18n="menu">Menu</span>
                </a>
                <a href="menu.html" class="brand-logo">
                    <i class="fa-solid fa-utensils"></i> TasteEthio
                </a>
            </div>

            <div class="header-actions">
                <button type="button" class="theme-toggle-btn nav-link-item" data-theme-toggle aria-label="Toggle theme" data-i18n-title="title_toggle_theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <a href="order-history.html" class="nav-link-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span data-i18n="history">History</span>
                </a>
                <a href="cart.html" class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-badge-count">0</span>
                </a>
                <!-- Logout (top-right) -->
                <a href="../common/login.html" class="nav-link-item nav-logout logout" data-i18n-title="nav_logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span data-i18n="logout">Logout</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container profile-layout">

        <!-- Profile content is a single column; the unified customer dashboard
             rail (injected by customer-sidebar.js) serves as the sidebar. -->
        <section class="profile-content">

            <!-- Profile Summary / Avatar Upload Card -->
            <div class="profile-card profile-card-inline">
                <div class="avatar-wrapper">
                    <img id="avatar-preview" src="https://via.placeholder.com/100" alt="Customer Avatar" class="profile-avatar">
                    <label for="avatar-upload" class="avatar-edit-btn" data-i18n-title="change_avatar">
                        <i class="fa-solid fa-camera"></i>
                    </label>
                    <input type="file" id="avatar-upload" accept="image/*" style="display:none;">
                </div>
                <h3 id="sidebar-user-name">Abebe Kebede</h3>
                <p id="sidebar-user-phone">+251 91 123 4567</p>
                <span class="member-badge"><i class="fa-solid fa-medal"></i> Cafeteria Member</span>
            </div>

            <div class="content-header">
                <h2><i class="fa-solid fa-sliders"></i> Account Details</h2>
                <p data-i18n="profile_manage_text">Manage your contact details and default dining preferences for faster checkout.</p>
            </div>

            <form id="profile-form" class="profile-form">

                <!-- Alert Message Container -->
                <div id="profile-alert" class="alert-box" style="display:none;"></div>

                <div class="form-section">
                    <h4 data-i18n="profile_personal_details">Personal Details</h4>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="customer-name" data-i18n="profile_full_name_req">Full Name *</label>
                            <input type="text" id="customer-name" required placeholder="e.g. Abebe Kebede">
                        </div>

                        <div class="form-group">
                            <label for="customer-username" data-i18n="profile_username">Username</label>
                            <input type="text" id="customer-username" placeholder="e.g. abebe_k" readonly
                                   style="background:#f1f5f9;cursor:not-allowed;">
                        </div>

                        <div class="form-group">
                            <label for="customer-phone" data-i18n="profile_phone_req">Phone Number *</label>
                            <input type="tel" id="customer-phone" required placeholder="0911234567">
                        </div>

                        <div class="form-group">
                            <label for="customer-email" data-i18n="email_address">Email Address</label>
                            <input type="email" id="customer-email" placeholder="abebe@example.com">
                        </div>

                        <div class="form-group" style="display:none">
                            <label for="preferred-language">Language Preference</label>
                            <select id="preferred-language" style="display:none">
                                <option value="en" selected>English</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="customer-address" data-i18n="profile_address">Address</label>
                            <input type="text" id="customer-address" data-i18n-placeholder="enter_address" placeholder="Your address" maxlength="255">
                        </div>
                    </div>
                </div>

                <hr class="form-divider">

                <div class="form-section">
                    <h4 data-i18n="profile_checkout_prefs">Default Checkout Preferences</h4>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="default-dining-type" data-i18n="profile_preferred_type">Preferred Order Type</label>
                            <select id="default-dining-type">
                                <option value="dine-in">Dine-In (Cafeteria Table)</option>
                                <option value="takeaway">Takeaway / Express Pick-up</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="default-table-number" data-i18n="profile_default_table">Default Table / Office #</label>
                            <input type="text" id="default-table-number" placeholder="e.g. Table 12 or Block B-201">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-save">
                        <i class="fa-solid fa-floppy-disk"></i> Save Changes
                    </button>
                </div>

            </form>

            <!-- Password Change Section -->
            <div class="form-divider" style="margin: 2rem 0;"></div>

            <div class="content-header">
                <h2><i class="fa-solid fa-lock"></i> Change Password</h2>
                <p data-i18n="profile_change_password_sub">Update your account password for security.</p>
            </div>

            <form id="password-change-form" class="profile-form">
                <div id="password-alert" class="alert-box" style="display:none;"></div>

                <div class="form-section">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="current-password" data-i18n="profile_current_password">Current Password *</label>
                            <div class="input-wrapper">
                                <input type="password" id="current-password" required data-i18n-placeholder="enter_current_password" placeholder="Enter current password">
                                <i class="fa-solid fa-eye toggle-password-icon" data-target="current-password" title="Show password"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="new-password" data-i18n="profile_new_password">New Password *</label>
                            <div class="input-wrapper">
                                <input type="password" id="new-password" required data-i18n-placeholder="min_6_characters" placeholder="Min 6 characters" minlength="6">
                                <i class="fa-solid fa-eye toggle-password-icon" data-target="new-password" title="Show password"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="confirm-password" data-i18n="profile_confirm_password">Confirm New Password *</label>
                            <div class="input-wrapper">
                                <input type="password" id="confirm-password" required data-i18n-placeholder="reenter_new_password" placeholder="Re-enter new password" minlength="6">
                                <i class="fa-solid fa-eye toggle-password-icon" data-target="confirm-password" title="Show password"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-save" id="change-password-btn">
                        <i class="fa-solid fa-key"></i> Update Password
                    </button>
                </div>
            </form>
        </section>

    </main>

    <script src="../../js/config.js"></script>
<script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/profile.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/components/customer-sidebar.js"></script>
    <script src="/public/assets/vendor/js/socket.io-4.7.5.min.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/customer-realtime.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/components/unified-header.js"></script>
</body>
</html>
