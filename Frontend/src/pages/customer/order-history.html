<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - Cafeteria Menu</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
<link rel="stylesheet" href="/src/css/themes/dark-theme.css">
    <script src="../../js/config.js"></script>
<script src="../../js/theme.js"></script>
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="container nav-container">
            <div class="nav-left-group">
                <a href="menu.html" class="btn-back">
                    <i class="fa-solid fa-arrow-left"></i> Back to Menu
                </a>
            </div>
            
            <h2><i class="fa-solid fa-clock-rotate-left"></i> Order History</h2>
            <div class="user-nav-links">
                <button type="button" class="theme-toggle-btn nav-icon-link" data-theme-toggle aria-label="Toggle theme" title="Toggle Dark/Light Mode"><i class="fa-solid fa-moon"></i></button>
                <a href="profile.html" class="nav-icon-link" title="Profile"><i class="fa-solid fa-user"></i></a>
                <a href="notifications.html" class="nav-icon-link" title="Notifications"><i class="fa-solid fa-bell"></i></a>
                <a href="feedback.html" class="nav-icon-link" title="Feedback"><i class="fa-solid fa-comment-dots"></i></a>
                <a href="../common/login.html" class="nav-icon-link nav-logout" title="Logout" onclick="localStorage.clear()"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
        </div>
    </header>

    <main class="container history-layout">

        <!-- Filters & Search Bar -->
        <section class="history-controls">
            <div class="history-filter-btns">
                <button class="history-tab active" data-filter="all">All Orders</button>
                <button class="history-tab" data-filter="Completed">Completed</button>
                <button class="history-tab" data-filter="Pending">In Progress / Pending</button>
                <button class="history-tab" data-filter="Cancelled">Cancelled</button>
                <button class="history-tab" data-filter="Refunded">Refunded</button>
            </div>
            <button id="clear-history-btn" class="btn btn-sm btn-outline-danger">
                <i class="fa-solid fa-trash-can"></i> Clear History
            </button>
        </section>

        <!-- Dynamic Orders List Container -->
        <section id="orders-history-list" class="orders-history-container">
            <!-- Dynamically populated via order-history.js -->
        </section>

    </main>

    <!-- Connect Scripts -->
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/utils/i18n.js"></script>
<script type="module" src="../../js/customer-orders-sync.js"></script>
<script src="../../js/config.js"></script>
<script type="module" src="../../js/order-history.js"></script>
    <script src="/public/assets/vendor/js/socket.io-4.7.5.min.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/customer-realtime.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/components/unified-header.js"></script>
<script src="../../js/config.js"></script>
<script type="module" src="../../js/components/customer-sidebar.js"></script>
</body>
</html>
