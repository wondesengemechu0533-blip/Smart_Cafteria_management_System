<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Reviews - TasteEthio Cafeteria</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/menu.css">
<link rel="stylesheet" href="/src/css/themes/dark-theme.css">
    <script src="../../js/config.js"></script>
<script src="../../js/theme.js"></script>
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar-header">
        <div class="nav-container">
            <div class="nav-left-group">
                <a href="menu.html" class="btn-back-home">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span data-i18n="menu">Menu</span>
                </a>
                <a href="menu.html" class="brand-logo">
                    <i class="fa-solid fa-utensils"></i> TasteEthio
                </a>
            </div>

            <div class="header-actions">
                <button type="button" class="theme-toggle-btn nav-link-item" data-theme-toggle aria-label="Toggle theme" data-i18n-title="title_toggle_theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <a href="order-history.html" class="nav-link-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span data-i18n="history">History</span>
                </a>
                <a href="cart.html" class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-badge-count">0</span>
                </a>
                
                <!-- User Profile Dropdown using requested image element -->
                <div class="user-profile-menu">
                    <button class="user-profile-btn" id="user-menu-btn">
                        <img class="avatar-img" alt="User Profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
                        <span class="user-name">Abebe K.</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-menu" id="user-dropdown-menu">
                        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
                        <a href="order-history.html"><i class="fa-solid fa-receipt"></i> My Orders</a>
                        <a href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a>
                        <a href="feedback.html"><i class="fa-solid fa-comment-dots"></i> Feedback</a>
                    </div>
                </div>
                <!-- Logout (top-right) -->
                <a href="../common/login.html" class="nav-link-item nav-logout logout-link" data-i18n-title="nav_logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span data-i18n="logout">Logout</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container profile-layout">

        <!-- The unified customer dashboard rail (customer-sidebar.js) is the
             sidebar here; this page renders only the content column. -->

        <!-- Main Content Area -->
        <section class="profile-content">
            <div class="content-header">
                <h2><i class="fa-solid fa-star-half-stroke"></i> Feedback & Reviews</h2>
                <p data-i18n="feedback_intro">We value your opinion! Rate your recent meal or cafeteria service.</p>
            </div>

            <!-- Feedback Submission Form -->
            <form id="feedback-form" class="feedback-form">
                <div id="feedback-alert" class="alert-box" style="display:none;"></div>

                <!-- Star Rating Selector -->
                <div class="form-group rating-container">
                    <label data-i18n="rating_label">Overall Experience Rating *</label>
                    <div class="star-rating" id="star-rating-group">
                        <i class="fa-solid fa-star star-btn" data-value="1"></i>
                        <i class="fa-solid fa-star star-btn" data-value="2"></i>
                        <i class="fa-solid fa-star star-btn" data-value="3"></i>
                        <i class="fa-solid fa-star star-btn" data-value="4"></i>
                        <i class="fa-solid fa-star star-btn" data-value="5"></i>
                    </div>
                    <span id="rating-text" class="rating-label-text">Select a rating</span>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="feedback-category" data-i18n="fb_topic">Feedback Topic</label>
                        <select id="feedback-category">
                            <option value="Food Quality" data-i18n="fb_food_quality">Food & Drink Quality</option>
                            <option value="Service Speed" data-i18n="fb_service_speed">Service & Preparation Speed</option>
                            <option value="Cleanliness" data-i18n="fb_cleanliness">Cafeteria Cleanliness</option>
                            <option value="App Suggestion" data-i18n="fb_app_suggestion">Website / App Suggestion</option>
                            <option value="Other" data-i18n="fb_other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dish-reviewed" data-i18n="dish_optional">Specific Dish (Optional)</label>
                        <input type="text" id="dish-reviewed" placeholder="e.g. Special Kitfo, Macchiato">
                    </div>
                </div>

                <div class="form-group" style="margin-top: 16px;">
                    <label for="feedback-comments" data-i18n="comments_review">Your Comments / Review *</label>
                    <textarea id="feedback-comments" rows="4" required placeholder="Tell us what you enjoyed or what we can improve..."></textarea>
                </div>

                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-paper-plane"></i> Submit Feedback
                    </button>
                </div>
            </form>

            <hr class="form-divider">

            <!-- Previously Submitted Feedback List -->
            <div class="previous-feedback-section">
                <h3 data-i18n="past_reviews">My Past Reviews</h3>
                <div id="past-feedback-list" class="feedback-list">
                    <!-- Populated via feedback.js -->
                </div>
            </div>
        </section>

    </main>

    <script src="../../js/config.js"></script>
<script type="module" src="../../js/profile.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/feedback.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/components/customer-sidebar.js"></script>
    <script src="/public/assets/vendor/js/socket.io-4.7.5.min.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/customer-realtime.js"></script>
    <script src="../../js/config.js"></script>
<script type="module" src="../../js/components/unified-header.js"></script>
</body>
</html>
