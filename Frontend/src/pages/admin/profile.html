<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile - Smart Cafeteria</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">

    <!-- Bootstrap CSS (required for grid + components) -->

    <!-- Admin CSS stylesheet -->
    <link rel="stylesheet" href="/src/css/admin.css">
    <link rel="stylesheet" href="../../css/themes/dark-theme.css">
    <script src="../../js/theme.js"></script>
</head>
<body class="admin-body">

    <!-- Layout will be injected by admin-layout.js -->
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <main class="admin-main">
            <div class="page-header">
                <div>
                    <h1>Admin Profile</h1>
                    <p class="subtitle">View your account details and update your password.</p>
                </div>
            </div>

            <div id="profileAlert" class="alert-banner" style="display:none;"></div>

            <div class="row g-4">
                <div class="col-xl-4">
                    <section class="card">
                        <div class="card-body text-center">
                            <div class="avatar profile-avatar mx-auto mb-3" id="profileAvatar">A</div>
                            <h3 id="profileName">Admin User</h3>
                            <p class="form-text" id="profileEmail">admin@example.com</p>
                            <span class="badge badge-primary" id="profileRole">ADMIN</span>
                        </div>
                    </section>
                </div>
                <div class="col-xl-8">
                    <section class="card">
                        <div class="card-header">
                            <h3 class="section-title"><i class="fa-solid fa-key"></i> Change Password</h3>
                        </div>
                        <div class="card-body">
                            <form id="passwordForm">
                                <div class="form-group">
                                    <label for="currentPassword" class="form-label">Current Password</label>
                                    <div class="input-wrapper">
                                        <input type="password" id="currentPassword" class="form-control" required>
                                        <i class="fa-solid fa-eye toggle-password-icon" data-target="currentPassword" title="Show password"></i>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="newPassword" class="form-label">New Password</label>
                                    <div class="input-wrapper">
                                        <input type="password" id="newPassword" class="form-control" required>
                                        <i class="fa-solid fa-eye toggle-password-icon" data-target="newPassword" title="Show password"></i>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                                    <div class="input-wrapper">
                                        <input type="password" id="confirmPassword" class="form-control" required>
                                        <i class="fa-solid fa-eye toggle-password-icon" data-target="confirmPassword" title="Show password"></i>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary" id="changePasswordBtn" form="passwordForm"><i class="fa-solid fa-key"></i> Update Password</button>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript Files -->
    <script src="../../js/config.js"></script>
    <script src="../../js/admin-api.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/admin-layout.js"></script>
    <script src="../../js/admin-ui.js"></script>
    <script src="../../js/admin-profile.js"></script>

    <script>
        // Page-specific initialization
        function initPageSpecific() {
            // admin-profile.js handles initialization via its own DOMContentLoaded
        }
    </script>
</body>
</html>
