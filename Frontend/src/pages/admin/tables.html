<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin_tables">Tables - Smart Cafeteria</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">

    <!-- Admin CSS stylesheet -->
    <link rel="stylesheet" href="/src/css/admin.css">
    <link rel="stylesheet" href="../../css/themes/dark-theme.css">
    <script src="../../js/theme.js"></script>
</head>
<body class="admin-body">

    <!-- Layout will be injected by admin-layout.js -->
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <main class="admin-main">
            <div class="page-header">
                <div>
                    <h1 data-i18n="admin_tables">Table Management</h1>
                    <p class="subtitle">Manage cafeteria tables — number, seats, zone, and status.</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary" id="openAddTableBtn">
                        <i class="fa-solid fa-plus"></i> Add Table
                    </button>
                </div>
            </div>

            <div class="metrics-grid mb-4">
                <div class="metric-card"><div class="metric-icon bg-indigo"><i class="fa-solid fa-table-cells-large"></i></div><div class="metric-content"><span class="metric-label">Total Tables</span><h2 class="metric-value" id="metricTotalTables">0</h2></div></div>
                <div class="metric-card"><div class="metric-icon bg-green"><i class="fa-solid fa-chair"></i></div><div class="metric-content"><span class="metric-label">Available</span><h2 class="metric-value" id="metricAvailableTables">0</h2></div></div>
                <div class="metric-card"><div class="metric-icon bg-blue"><i class="fa-solid fa-user"></i></div><div class="metric-content"><span class="metric-label">Occupied</span><h2 class="metric-value" id="metricOccupiedTables">0</h2></div></div>
                <div class="metric-card"><div class="metric-icon bg-orange"><i class="fa-solid fa-calendar-check"></i></div><div class="metric-content"><span class="metric-label">Reserved</span><h2 class="metric-value" id="metricReservedTables">0</h2></div></div>
            </div>

            <!-- FILTER TOOLBAR -->
            <section class="card">
                <div class="card-header users-toolbar">
                    <div class="search-wrap">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="tableSearchInput" class="form-control" placeholder="Search tables...">
                    </div>
                    <div class="filter-group">
                        <select id="tableStatusFilter" class="form-select">
                            <option value="">All Status</option>
                            <option value="available">Available</option>
                            <option value="occupied">Occupied</option>
                            <option value="reserved">Reserved</option>
                            <option value="maintenance">Maintenance</option>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                        <select id="tableSortFilter" class="form-select">
                            <option value="number">Table Number</option>
                            <option value="seats">Seats</option>
                            <option value="created">Newest</option>
                            <option value="updated">Updated</option>
                        </select>
                        <button class="btn btn-secondary" id="resetTableFiltersBtn" title="Reset filters">
                            <i class="fa-solid fa-filter-circle-xmark"></i> Reset
                        </button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Table #</th>
                                <th>Seats</th>
                                <th>Zone</th>
                                <th>Status</th>
                                <th>Active</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tablesTableBody">
                            <tr><td colspan="6" class="table-empty">Loading tables...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination">
                    <span class="pagination-info" id="tablePaginationInfo">Page 1</span>
                    <div class="pagination-actions">
                        <button class="btn btn-secondary" id="prevTablePageBtn" title="Previous page"><i class="fa-solid fa-chevron-left"></i> Prev</button>
                        <button class="btn btn-secondary" id="nextTablePageBtn" title="Next page">Next <i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ===== ADD / EDIT TABLE MODAL ===== -->
    <div class="modal-overlay" id="tableModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="tableModalTitle">Add New Table</h3>
                <button class="modal-close" data-close-modal="tableModal">&times;</button>
            </div>
            <form id="tableForm">
                <input type="hidden" name="id" id="tableId">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="tableNumber" class="form-label">Table Number <span class="required">*</span></label>
                            <input type="text" name="tableNumber" id="tableNumber" class="form-control" placeholder="e.g. T1, 12" required>
                        </div>
                        <div class="form-group">
                            <label for="tableSeats" class="form-label">Seats</label>
                            <input type="number" id="tableSeats" class="form-control" min="1" step="1" value="4">
                        </div>
                        <div class="form-group">
                            <label for="tableZone" class="form-label">Zone / Area</label>
                            <input type="text" id="tableZone" class="form-control" placeholder="e.g. Main Hall, Terrace">
                        </div>
                        <div class="form-group">
                            <label for="tableOccupancyStatus" class="form-label">Occupancy Status</label>
                            <select id="tableOccupancyStatus" class="form-select">
                                <option value="available">Available</option>
                                <option value="occupied">Occupied</option>
                                <option value="reserved">Reserved</option>
                                <option value="maintenance">Maintenance</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Active</label>
                            <label class="switch">
                                <input type="checkbox" id="tableIsActive" checked>
                                <span class="switch-slider"></span>
                            </label>
                            <small class="form-text">Active tables are available for dine-in orders</small>
                        </div>
                    </div>
                    <div class="form-group mt-3">
                        <label for="tableNotes" class="form-label">Notes</label>
                        <textarea id="tableNotes" class="form-control" rows="2" placeholder="Optional notes (window seat, near kitchen, etc.)"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close-modal="tableModal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveTableBtn">Save Table</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../../js/config.js"></script>
    <script src="../../js/admin-api.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/admin-layout.js"></script>
    <script src="../../js/admin-ui.js"></script>
    <script src="../../js/admin-tables.js"></script>

    <script>
        function initPageSpecific() {
            // admin-tables.js handles initialization via its own DOMContentLoaded
        }
    </script>
</body>
</html>
