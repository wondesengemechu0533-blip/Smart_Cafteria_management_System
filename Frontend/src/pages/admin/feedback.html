<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Smart Cafeteria</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">

    <!-- Bootstrap CSS (required for grid + components) -->

    <!-- Admin CSS stylesheet -->
    <link rel="stylesheet" href="/src/css/admin.css">
    <link rel="stylesheet" href="../../css/themes/dark-theme.css">
    <script src="../../js/theme.js"></script>
</head>
<body class="admin-body">

    <!-- Layout will be injected by admin-layout.js -->
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <main class="admin-main">
            <div class="page-header">
                <div class="page-title-group">
                    <h1>Feedback</h1>
                    <p class="page-subtitle">View and manage customer feedback and reviews.</p>
                </div>
            </div>

            <!-- FILTER TOOLBAR -->
            <section class="card">
                <div class="card-header users-toolbar">
                    <div class="search-wrap">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="feedbackSearchInput" class="form-control" placeholder="Search by user, order, or comment...">
                    </div>
                    <div class="filter-group">
                        <select id="feedbackStatusFilter" class="form-select">
                            <option value="">All Status</option>
                            <option value="PENDING">Pending</option>
                            <option value="RESOLVED">Resolved</option>
                            <option value="ARCHIVED">Archived</option>
                        </select>
                        <select id="feedbackRatingFilter" class="form-select">
                            <option value="">All Ratings</option>
                            <option value="5">5 Stars</option>
                            <option value="4">4 Stars</option>
                            <option value="3">3 Stars</option>
                            <option value="2">2 Stars</option>
                            <option value="1">1 Star</option>
                        </select>
                        <button class="btn btn-secondary" id="resetFeedbackFiltersBtn" title="Reset filters">
                            <i class="fa-solid fa-filter-circle-xmark"></i> Reset
                        </button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Rating</th>
                                <th>Category</th>
                                <th>Dish</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="feedbackTableBody">
                            <tr><td colspan="8" class="table-empty">Loading feedback...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination">
                    <span class="pagination-info" id="paginationInfo">Page 1</span>
                    <div class="pagination-actions">
                        <button class="btn btn-secondary" id="prevPageBtn" title="Previous page"><i class="fa-solid fa-chevron-left"></i> Prev</button>
                        <button class="btn btn-secondary" id="nextPageBtn" title="Next page">Next <i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ===== FEEDBACK DETAILS MODAL ===== -->
    <div class="modal-overlay" id="feedbackDetailsModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 class="modal-title">Feedback Details - <span id="modalFeedbackId">#0000</span></h3>
                <button class="modal-close" data-close-modal="feedbackDetailsModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-hero">
                    <div class="avatar detail-avatar" id="modalFeedbackAvatar">U</div>
                    <div>
                        <h4 id="modalFeedbackUser">—</h4>
                        <div id="modalFeedbackRole" class="form-text">—</div>
                    </div>
                </div>

                <div class="detail-grid">
                    <div class="detail-item"><span>Feedback ID</span><strong id="modalFeedbackIdVal">—</strong></div>
                    <div class="detail-item"><span>Order</span><strong id="modalFeedbackOrder">—</strong></div>
                    <div class="detail-item"><span>Rating</span><strong id="modalFeedbackRating">—</strong></div>
                    <div class="detail-item"><span>Category</span><strong id="modalFeedbackCategory">—</strong></div>
                    <div class="detail-item"><span>Dish</span><strong id="modalFeedbackDish">—</strong></div>
                    <div class="detail-item"><span>Submitted</span><strong id="modalFeedbackDate">—</strong></div>
                    <div class="detail-item"><span>Status</span><strong id="modalFeedbackStatus">—</strong></div>
                </div>

                <hr class="form-divider">

                <h4 class="section-heading"><i class="fa-solid fa-comment"></i> Comment</h4>
                <p id="modalFeedbackComment" class="text-muted pre-wrap">—</p>

                <hr class="form-divider">

                <h4 class="section-heading"><i class="fa-solid fa-reply"></i> Admin Reply</h4>
                <div class="form-group">
                    <label for="modalFeedbackReply" class="form-label">Your Reply</label>
                    <textarea id="modalFeedbackReply" class="form-control" rows="3" placeholder="Write your response to the customer..."></textarea>
                </div>

                <div class="form-group d-flex align-items-center gap-2">
                    <label class="switch">
                        <input type="checkbox" id="modalFeedbackMarkResolved">
                        <span class="switch-slider"></span>
                    </label>
                    <span class="form-text">Mark as resolved</span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal="feedbackDetailsModal">Close</button>
                <button type="button" class="btn btn-primary" id="sendFeedbackReplyBtn"><i class="fa-solid fa-paper-plane"></i> Send Reply</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="/public/assets/vendor/js/socket.io-4.7.5.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/admin-api.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/admin-layout.js"></script>
    <script src="../../js/admin-ui.js"></script>
    <script src="../../js/admin-feedback.js"></script>

    <script>
        // Page-specific initialization
        function initPageSpecific() {
            // admin-feedback.js handles initialization via its own DOMContentLoaded
        }
    </script>
</body>
</html>
